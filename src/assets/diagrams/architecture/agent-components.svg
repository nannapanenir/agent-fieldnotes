<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Where the parts of an AI agent live</title>
  <desc id="desc">The application owns the loop and contains four parts: instructions, which are guidance only; policy and limits, which enforce rules; session state for this conversation; and a tool gateway that checks, then runs, tool calls. The model sits outside the application. The application sends it instructions, selected context, and tool definitions, and the model returns proposals, which are untrusted. Tools sit outside behind the gateway and return untrusted results. The signed-in user sends requests into the application. A human approval box connects to policy and limits for high-impact actions. An optional long-term memory store, scoped per user, is read and written by the application. Provider-hosted tools run outside the application as a separate boundary.</desc>
  <!--
    Hand-authored source. Edit this file directly; there is no separate generator.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: solid arrows = requests, dashed arrows = responses (untrusted until checked),
    the solid acid box = what the application controls.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ce6db"/>
    </marker>
    <style>
      .head { font: 600 14px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .lbl { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; paint-order: stroke; stroke: #171a16; stroke-width: 5px; stroke-linejoin: round; }
      .lbl-untrusted { font: 600 12px 'DM Sans', system-ui, sans-serif; fill: #9ce6db; paint-order: stroke; stroke: #171a16; stroke-width: 5px; stroke-linejoin: round; }
      .tag { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
    </style>
  </defs>

  <rect width="760" height="560" fill="#171a16"/>

  <!-- Model (outside the application) -->
  <rect x="240" y="20" width="280" height="60" rx="4" fill="#1d211b" stroke="#a4a99f"/>
  <text class="head" x="380" y="45" text-anchor="middle">Model</text>
  <text class="sub" x="380" y="65" text-anchor="middle">proposes only · no memory between calls</text>

  <!-- Provider-hosted tools note -->
  <rect x="560" y="25" width="180" height="50" rx="4" fill="none" stroke="#9ce6db" stroke-dasharray="5 4"/>
  <text class="sub" x="650" y="46" text-anchor="middle" style="fill:#d4d8cf">provider-hosted tools</text>
  <text class="sub" x="650" y="63" text-anchor="middle">separate boundary</text>

  <!-- Application -> model and back -->
  <line x1="340" y1="128" x2="340" y2="84" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="332" y="104" text-anchor="end">instructions + context</text>
  <text class="lbl" x="332" y="120" text-anchor="end">+ tool definitions</text>
  <line x1="420" y1="80" x2="420" y2="124" stroke="#9ce6db" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text class="lbl-untrusted" x="428" y="104">proposal</text>
  <text class="lbl-untrusted" x="428" y="120">untrusted</text>

  <!-- Application container -->
  <rect x="200" y="130" width="360" height="220" rx="4" fill="#191d18" stroke="#c7f36b" stroke-width="2"/>
  <rect x="200" y="130" width="196" height="20" fill="#171a16" stroke="#c7f36b"/>
  <text class="tag" x="209" y="144">application · owns the loop</text>

  <rect x="220" y="170" width="150" height="60" rx="3" fill="#232822" stroke="#737b70"/>
  <text class="head" x="295" y="195" text-anchor="middle">Instructions</text>
  <text class="sub" x="295" y="214" text-anchor="middle">guidance only</text>

  <rect x="390" y="170" width="150" height="60" rx="3" fill="#232822" stroke="#c7f36b"/>
  <text class="head" x="465" y="195" text-anchor="middle">Policy &amp; limits</text>
  <text class="sub" x="465" y="214" text-anchor="middle">enforces rules</text>

  <rect x="220" y="260" width="150" height="60" rx="3" fill="#232822" stroke="#737b70"/>
  <text class="head" x="295" y="285" text-anchor="middle">Session state</text>
  <text class="sub" x="295" y="304" text-anchor="middle">this conversation</text>

  <rect x="390" y="260" width="150" height="60" rx="3" fill="#232822" stroke="#c7f36b"/>
  <text class="head" x="465" y="285" text-anchor="middle">Tool gateway</text>
  <text class="sub" x="465" y="304" text-anchor="middle">checks, then runs</text>

  <!-- User -->
  <rect x="20" y="168" width="140" height="64" rx="16" fill="#1d211b" stroke="#a4a99f"/>
  <text class="head" x="90" y="195" text-anchor="middle">User</text>
  <text class="sub" x="90" y="214" text-anchor="middle">signed in</text>
  <line x1="160" y1="200" x2="196" y2="200" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Human approval -->
  <rect x="600" y="168" width="140" height="64" rx="16" fill="#1d211b" stroke="#a4a99f"/>
  <text class="head" x="670" y="195" text-anchor="middle">Human approval</text>
  <text class="sub" x="670" y="214" text-anchor="middle">high-impact actions</text>
  <line x1="544" y1="200" x2="596" y2="200" stroke="#f0f0e8" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Tools -->
  <rect x="600" y="252" width="140" height="76" rx="4" fill="#1d211b" stroke="#a4a99f"/>
  <text class="head" x="670" y="278" text-anchor="middle">Tools</text>
  <text class="sub" x="670" y="297" text-anchor="middle">getShipmentStatus</text>
  <text class="sub" x="670" y="314" text-anchor="middle">results untrusted</text>
  <line x1="544" y1="280" x2="596" y2="280" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="596" y1="302" x2="546" y2="302" stroke="#9ce6db" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>

  <!-- Long-term memory -->
  <rect x="210" y="402" width="170" height="64" rx="16" fill="#1d211b" stroke="#a4a99f" stroke-dasharray="6 4"/>
  <text class="head" x="295" y="429" text-anchor="middle">Long-term memory</text>
  <text class="sub" x="295" y="448" text-anchor="middle">optional · per user</text>
  <line x1="295" y1="324" x2="295" y2="398" stroke="#f0f0e8" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="305" y="383">read/write by the application</text>

  <!-- Legend -->
  <line x1="20" y1="508" x2="50" y2="508" stroke="#f0f0e8" stroke-width="1.6"/>
  <text class="sub" x="58" y="512" style="fill:#d4d8cf">Solid arrow: request or call.</text>
  <line x1="300" y1="508" x2="330" y2="508" stroke="#9ce6db" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="sub" x="338" y="512" style="fill:#d4d8cf">Dashed arrow: response, untrusted until checked.</text>
  <rect x="20" y="526" width="26" height="14" fill="none" stroke="#c7f36b" stroke-width="2"/>
  <text class="sub" x="58" y="537" style="fill:#d4d8cf">Bright outline: the parts that enforce rules (policy and limits, tool gateway).</text>
</svg>

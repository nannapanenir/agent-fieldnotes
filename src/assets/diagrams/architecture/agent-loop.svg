<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="title desc">
  <title id="title">One turn of a bounded agent loop</title>
  <desc id="desc">Sequence diagram with four participants: User, Application, Model, and Tool. 1, the user sends a task and identity to the application. 2, the application validates the request and builds context. Steps 3 to 6 repeat in a loop: 3, the application sends context and the allowed tools to the model, and the model returns a proposed action. 4, the application checks the schema, authorization, and limits. 5, the application runs the tool with a timeout and receives an untrusted result. 6, the application returns a bounded, untrusted observation to the model, which replies with an answer or a next action. 7, the application returns the result or a handoff to the user. The loop stops on a final answer, a step limit, a time or cost limit, a refusal, repeated errors, or a human handoff.</desc>
  <!--
    Hand-authored source. Edit this file directly; there is no separate generator.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: solid = request/call, dashed = response, labels say "untrusted".
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a4a99f"/>
    </marker>
    <style>
      .lbl { font: 500 12.5px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; paint-order: stroke; stroke: #171a16; stroke-width: 5px; stroke-linejoin: round; }
      .lbl-muted { font: 500 12.5px 'DM Sans', system-ui, sans-serif; fill: #c9cec3; paint-order: stroke; stroke: #171a16; stroke-width: 5px; stroke-linejoin: round; }
      .head { font: 600 15px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .note { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .tag { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
    </style>
  </defs>

  <rect width="720" height="600" fill="#171a16"/>

  <!-- Participants -->
  <g text-anchor="middle">
    <rect x="35" y="20" width="130" height="48" rx="14" fill="#1d211b" stroke="#a4a99f"/>
    <text class="head" x="100" y="49">User</text>

    <rect x="215" y="20" width="150" height="48" rx="3" fill="#1d211b" stroke="#c7f36b" stroke-width="2"/>
    <text class="head" x="290" y="41">Application</text>
    <text class="sub" x="290" y="58">owns the loop</text>

    <rect x="415" y="20" width="130" height="48" rx="3" fill="#1d211b" stroke="#a4a99f"/>
    <text class="head" x="480" y="41">Model</text>
    <text class="sub" x="480" y="58">proposes only</text>

    <rect x="580" y="20" width="120" height="48" rx="3" fill="#1d211b" stroke="#a4a99f"/>
    <text class="head" x="640" y="49">Tool</text>
  </g>

  <!-- Lifelines -->
  <g stroke-dasharray="3 5" stroke-width="1.2">
    <line x1="100" y1="68" x2="100" y2="505" stroke="#737b70"/>
    <line x1="290" y1="68" x2="290" y2="505" stroke="#c7f36b"/>
    <line x1="480" y1="68" x2="480" y2="505" stroke="#737b70"/>
    <line x1="640" y1="68" x2="640" y2="505" stroke="#737b70"/>
  </g>

  <!-- 1. Task -->
  <line x1="100" y1="105" x2="286" y2="105" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="195" y="97" text-anchor="middle">1. Task + identity</text>

  <!-- 2. Validate and build context -->
  <rect x="203" y="124" width="174" height="30" rx="3" fill="#232822" stroke="#c7f36b"/>
  <text class="note" x="290" y="144" text-anchor="middle">2. Validate, build context</text>

  <!-- Loop frame -->
  <rect x="185" y="172" width="525" height="290" rx="4" fill="none" stroke="#9ce6db" stroke-dasharray="7 5"/>
  <rect x="185" y="172" width="138" height="20" fill="#171a16" stroke="#9ce6db"/>
  <text class="tag" x="194" y="186">loop: repeat 3–6</text>

  <!-- 3. Context to model, proposed action back -->
  <line x1="290" y1="215" x2="476" y2="215" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="385" y="207" text-anchor="middle">3. Context + allowed tools</text>
  <line x1="480" y1="248" x2="294" y2="248" stroke="#a4a99f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text class="lbl-muted" x="385" y="241" text-anchor="middle">Proposed action</text>

  <!-- 4. Checks -->
  <rect x="193" y="266" width="194" height="32" rx="3" fill="#232822" stroke="#c7f36b"/>
  <text class="note" x="290" y="287" text-anchor="middle">4. Check schema, authz, limits</text>

  <!-- 5. Run tool, result back -->
  <line x1="290" y1="330" x2="636" y2="330" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="560" y="322" text-anchor="middle">5. Run tool (timeout)</text>
  <line x1="640" y1="362" x2="294" y2="362" stroke="#a4a99f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text class="lbl-muted" x="560" y="355" text-anchor="middle">Result (untrusted)</text>

  <!-- 6. Observation to model, reply back -->
  <line x1="290" y1="405" x2="476" y2="405" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="385" y="397" text-anchor="middle">6. Bounded observation (untrusted)</text>
  <line x1="480" y1="438" x2="294" y2="438" stroke="#a4a99f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text class="lbl-muted" x="385" y="431" text-anchor="middle">Answer or next action</text>

  <!-- 7. Result to user -->
  <line x1="290" y1="492" x2="104" y2="492" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="195" y="484" text-anchor="middle">7. Result or handoff</text>

  <!-- Stop conditions -->
  <rect x="20" y="518" width="680" height="50" rx="3" fill="#1d211b" stroke="#c7f36b" stroke-dasharray="2 3"/>
  <text class="note" x="34" y="539">Stop conditions, enforced by the application:</text>
  <text class="sub" x="34" y="557" style="fill:#d4d8cf">final answer · step limit · time or cost limit · refusal · repeated errors · human handoff</text>

  <text class="sub" x="20" y="590">Solid arrows: requests and calls. Dashed arrows: responses.</text>
</svg>

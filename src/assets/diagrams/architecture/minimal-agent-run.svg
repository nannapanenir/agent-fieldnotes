<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc">
  <title id="title">One run of the minimal agent</title>
  <desc id="desc">Sequence diagram with four participants: the command line, the loop, the model, and the tool. 1, the command line passes the question to the loop. 2, the loop checks the step, time, and token limits. 3, the loop calls the model with the conversation and the tool definition, with a timeout of the time left. 4, the model returns a tool_use request, and the loop adds its tokens to the total. 5, the loop runs getShipmentStatus and trims the result, which is untrusted. 6, the loop checks the limits again and calls the model with the tool result. 7, the model returns end_turn with the answer. 8, the loop returns the answer to the command line. A box at the bottom lists the five ways a run ends: answered, step limit, time limit, token limit, or an unexpected or refused response.</desc>
  <!--
    Hand-authored source. Edit this file directly; there is no separate generator.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: solid arrows = calls, dashed arrows = responses, checks are boxed and labeled, untrusted is written out.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ce6db"/></marker>
    <style>
      .head { font: 600 14px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .lbl { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .ulbl { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #9ce6db; }
      .chk { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
      .note { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #d4d8cf; }
      .lane { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .app { fill: #232822; stroke: #c7f36b; stroke-width: 1.6; }
      .life { stroke: rgba(235,243,225,.22); stroke-width: 1; stroke-dasharray: 3 4; }
    </style>
  </defs>
  <rect width="760" height="580" fill="#171a16"/>

  <!-- Participants -->
  <rect class="lane" x="20" y="20" width="120" height="48" rx="14"/>
  <text class="head" x="80" y="42" text-anchor="middle">Command line</text>
  <text class="sub" x="80" y="58" text-anchor="middle">main.ts</text>
  <rect class="app" x="195" y="20" width="130" height="48" rx="3"/>
  <text class="head" x="260" y="42" text-anchor="middle">Loop</text>
  <text class="sub" x="260" y="58" text-anchor="middle">loop.ts</text>
  <rect class="lane" x="455" y="20" width="130" height="48" rx="3"/>
  <text class="head" x="520" y="42" text-anchor="middle">Model</text>
  <text class="sub" x="520" y="58" text-anchor="middle">proposes only</text>
  <rect class="lane" x="625" y="20" width="120" height="48" rx="3"/>
  <text class="head" x="685" y="42" text-anchor="middle">Tool</text>
  <text class="sub" x="685" y="58" text-anchor="middle">read-only</text>

  <line class="life" x1="80" y1="68" x2="80" y2="460"/>
  <line class="life" x1="260" y1="68" x2="260" y2="460" style="stroke:#c7f36b"/>
  <line class="life" x1="520" y1="68" x2="520" y2="460"/>
  <line class="life" x1="685" y1="68" x2="685" y2="460"/>

  <!-- 1 -->
  <text class="lbl" x="170" y="96" text-anchor="middle">1  question</text>
  <line x1="80" y1="104" x2="256" y2="104" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- 2 -->
  <rect class="app" x="160" y="118" width="200" height="28" rx="3"/>
  <text class="chk" x="260" y="136" text-anchor="middle">2  check step, time, tokens</text>
  <!-- 3 -->
  <text class="lbl" x="390" y="172" text-anchor="middle">3  conversation + tool; timeout = time left</text>
  <line x1="260" y1="180" x2="516" y2="180" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- 4 -->
  <text class="ulbl" x="390" y="208" text-anchor="middle">4  tool_use request; tokens added</text>
  <line x1="520" y1="216" x2="264" y2="216" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <!-- 5 -->
  <text class="lbl" x="472" y="246" text-anchor="middle">5  run getShipmentStatus</text>
  <line x1="260" y1="254" x2="681" y2="254" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="ulbl" x="472" y="280" text-anchor="middle">trimmed result (untrusted)</text>
  <line x1="685" y1="288" x2="264" y2="288" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <!-- 6 -->
  <rect class="app" x="160" y="304" width="200" height="28" rx="3"/>
  <text class="chk" x="260" y="322" text-anchor="middle">6  check limits again</text>
  <text class="lbl" x="390" y="356" text-anchor="middle">conversation + tool result</text>
  <line x1="260" y1="364" x2="516" y2="364" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- 7 -->
  <text class="ulbl" x="390" y="392" text-anchor="middle">7  end_turn with the answer</text>
  <line x1="520" y1="400" x2="264" y2="400" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <!-- 8 -->
  <text class="lbl" x="170" y="428" text-anchor="middle">8  answer</text>
  <line x1="260" y1="436" x2="84" y2="436" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Stop conditions -->
  <rect x="20" y="476" width="720" height="50" rx="3" fill="#1d211b" stroke="#c7f36b" stroke-dasharray="2 3"/>
  <text class="lbl" x="36" y="497">Every run ends in exactly one way, decided by the loop:</text>
  <text class="note" x="36" y="515">answered · step limit · time limit · token limit · refused or unexpected response</text>

  <line x1="20" y1="556" x2="50" y2="556" stroke="#f0f0e8" stroke-width="1.4"/>
  <text class="note" x="58" y="560">Solid: a call.</text>
  <line x1="200" y1="556" x2="230" y2="556" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="note" x="238" y="560">Dashed: a response.</text>
  <rect x="420" y="549" width="26" height="14" class="app"/>
  <text class="note" x="454" y="560">Outlined: a check in code.</text>
</svg>

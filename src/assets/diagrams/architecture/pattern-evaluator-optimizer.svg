<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Evaluator-optimizer</title>
  <desc id="desc">Left to right: a task goes to a model that generates a draft. A second model evaluates it against written criteria, and a code step checks the score and the number of rounds. If it passes, the result is returned. If it fails, the evaluator's feedback goes back to the generator for another round. After three failed rounds, the run stops at a human checkpoint.</desc>
  <!--
    Hand-authored source, generated once from a small script; edit this file directly.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: every box is labeled "Model:", "Code:", or "Human checkpoint",
    and untrusted inputs say "untrusted".
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ce6db"/></marker>
    <style>
      .node { font: 500 13px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .usub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
      .note { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #d4d8cf; }
      .model { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .code { fill: #232822; stroke: #c7f36b; stroke-width: 1.4; }
      .human { fill: #232822; stroke: #f0f0e8; stroke-width: 2.2; }
      .human-inner { fill: none; stroke: #232822; stroke-width: 1.2; }
      .io { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .untrusted { fill: #1d211b; stroke: #9ce6db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="760" height="240" fill="#171a16"/>
  <rect class="io" x="20" y="40" width="90" height="56" rx="18"/>
  <text class="node" x="65" y="72" text-anchor="middle">Task</text>
  <rect class="model" x="140" y="40" width="140" height="56" rx="3"/>
  <text class="node" x="210" y="64" text-anchor="middle">Model: generate</text>
  <text class="sub" x="210" y="81" text-anchor="middle">draft</text>
  <rect class="model" x="310" y="40" width="150" height="56" rx="3"/>
  <text class="node" x="385" y="64" text-anchor="middle">Model: evaluate</text>
  <text class="sub" x="385" y="81" text-anchor="middle">against criteria</text>
  <rect class="code" x="490" y="40" width="110" height="56" rx="3"/>
  <text class="node" x="545" y="64" text-anchor="middle">Code: pass?</text>
  <text class="sub" x="545" y="81" text-anchor="middle">score + rounds</text>
  <rect class="io" x="630" y="40" width="110" height="56" rx="18"/>
  <text class="node" x="685" y="72" text-anchor="middle">Result</text>
  <line x1="110" y1="68" x2="136" y2="68" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="280" y1="68" x2="306" y2="68" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="460" y1="68" x2="486" y2="68" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="600" y1="68" x2="626" y2="68" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M545,96 V140 H210 V100" fill="none" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)"/>
  <text class="usub" x="377" y="134" text-anchor="middle">fail: feedback to the generator</text>
  <line x1="575" y1="96" x2="575" y2="168" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect class="human" x="500" y="172" width="150" height="50" rx="3"/>
  <rect class="human-inner" x="504" y="176" width="142" height="42" rx="2"/>
  <text class="node" x="575" y="193" text-anchor="middle">Human checkpoint</text>
  <text class="sub" x="575" y="210" text-anchor="middle">after 3 failed rounds</text>
</svg>

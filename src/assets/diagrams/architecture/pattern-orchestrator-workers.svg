<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Orchestrator and workers</title>
  <desc id="desc">Left to right: an untrusted task goes to an orchestrator model that plans subtasks at run time. A code step checks each subtask brief for permissions and limits before two read-only worker models run. Their results return as untrusted input to a model that combines them, and a human checkpoint approves any write before it happens.</desc>
  <!--
    Hand-authored source, generated once from a small script; edit this file directly.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: every box is labeled "Model:", "Code:", or "Human checkpoint",
    and untrusted inputs say "untrusted".
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ce6db"/></marker>
    <style>
      .node { font: 500 13px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .usub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
      .note { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #d4d8cf; }
      .model { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .code { fill: #232822; stroke: #c7f36b; stroke-width: 1.4; }
      .human { fill: #232822; stroke: #f0f0e8; stroke-width: 2.2; }
      .human-inner { fill: none; stroke: #232822; stroke-width: 1.2; }
      .io { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .untrusted { fill: #1d211b; stroke: #9ce6db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="760" height="280" fill="#171a16"/>
  <rect class="untrusted" x="20" y="104" width="85" height="56" rx="18"/>
  <text class="node" x="62.5" y="128" text-anchor="middle">Task</text>
  <text class="usub" x="62.5" y="145" text-anchor="middle">untrusted</text>
  <rect class="model" x="125" y="104" width="145" height="56" rx="3"/>
  <text class="node" x="197.5" y="128" text-anchor="middle">Model: orchestrator</text>
  <text class="sub" x="197.5" y="145" text-anchor="middle">plans subtasks</text>
  <rect class="code" x="290" y="104" width="125" height="56" rx="3"/>
  <text class="node" x="352.5" y="128" text-anchor="middle">Code: check briefs</text>
  <text class="sub" x="352.5" y="145" text-anchor="middle">scope + limits</text>
  <rect class="model" x="440" y="30" width="130" height="56" rx="3"/>
  <text class="node" x="505" y="54" text-anchor="middle">Model: worker</text>
  <text class="sub" x="505" y="71" text-anchor="middle">read-only</text>
  <rect class="model" x="440" y="178" width="130" height="56" rx="3"/>
  <text class="node" x="505" y="202" text-anchor="middle">Model: worker</text>
  <text class="sub" x="505" y="219" text-anchor="middle">read-only</text>
  <rect class="model" x="595" y="104" width="145" height="56" rx="3"/>
  <text class="node" x="667.5" y="128" text-anchor="middle">Model: combine</text>
  <text class="sub" x="667.5" y="145" text-anchor="middle">results untrusted</text>
  <rect class="human" x="595" y="210" width="145" height="50" rx="3"/>
  <rect class="human-inner" x="599" y="214" width="137" height="42" rx="2"/>
  <text class="node" x="667.5" y="231" text-anchor="middle">Human checkpoint</text>
  <text class="sub" x="667.5" y="248" text-anchor="middle">before any write</text>
  <line x1="105" y1="132" x2="121" y2="132" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="270" y1="132" x2="286" y2="132" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M415,132 C428,132 428,58 436,58" fill="none" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M415,132 C428,132 428,206 436,206" fill="none" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M570,58 C585,58 585,120 591,120" fill="none" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)"/>
  <path d="M570,206 C585,206 585,144 591,144" fill="none" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)"/>
  <line x1="667" y1="160" x2="667" y2="206" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>

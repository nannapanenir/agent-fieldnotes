<svg xmlns="http://www.w3.org/2000/svg" width="760" height="256" viewBox="0 0 760 256" role="img" aria-labelledby="title desc">
  <title id="title">Parallelization</title>
  <desc id="desc">Left to right: an untrusted request goes to a code step that splits it into fixed parts. Three model calls handle part A, part B, and part C at the same time. A code step combines their outputs, or takes a vote when all three answered the same question, and returns one result.</desc>
  <!--
    Hand-authored source, generated once from a small script; edit this file directly.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: every box is labeled "Model:", "Code:", or "Human checkpoint",
    and untrusted inputs say "untrusted".
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ce6db"/></marker>
    <style>
      .node { font: 500 13px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .usub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
      .note { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #d4d8cf; }
      .model { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .code { fill: #232822; stroke: #c7f36b; stroke-width: 1.4; }
      .human { fill: #232822; stroke: #f0f0e8; stroke-width: 2.2; }
      .human-inner { fill: none; stroke: #232822; stroke-width: 1.2; }
      .io { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .untrusted { fill: #1d211b; stroke: #9ce6db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="760" height="256" fill="#171a16"/>
  <rect class="untrusted" x="20" y="104" width="110" height="56" rx="18"/>
  <text class="node" x="75" y="128" text-anchor="middle">Request</text>
  <text class="usub" x="75" y="145" text-anchor="middle">untrusted</text>
  <rect class="code" x="160" y="104" width="110" height="56" rx="3"/>
  <text class="node" x="215" y="128" text-anchor="middle">Code: split</text>
  <text class="sub" x="215" y="145" text-anchor="middle">fixed parts</text>
  <rect class="model" x="310" y="30" width="160" height="56" rx="3"/>
  <text class="node" x="390" y="62" text-anchor="middle">Model: part A</text>
  <rect class="model" x="310" y="104" width="160" height="56" rx="3"/>
  <text class="node" x="390" y="136" text-anchor="middle">Model: part B</text>
  <rect class="model" x="310" y="178" width="160" height="56" rx="3"/>
  <text class="node" x="390" y="210" text-anchor="middle">Model: part C</text>
  <rect class="code" x="510" y="104" width="110" height="56" rx="3"/>
  <text class="node" x="565" y="128" text-anchor="middle">Code: combine</text>
  <text class="sub" x="565" y="145" text-anchor="middle">or vote</text>
  <rect class="io" x="650" y="104" width="90" height="56" rx="18"/>
  <text class="node" x="695" y="136" text-anchor="middle">Result</text>

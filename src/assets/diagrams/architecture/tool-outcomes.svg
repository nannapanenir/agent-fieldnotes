<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">Outcomes of one tool call</title>
  <desc id="desc">Flowchart. The model proposes a tool call, which is untrusted. The runner checks that the tool is known, the call limit, and the argument shape. The tool runs with a timeout: 5 seconds per read attempt and 10 seconds per booking. There are four outcomes. Success returns data. A validation error, such as bad arguments, is not retried. A denial, such as another customer's package or a declined approval, is not retried. A timeout or upstream failure splits by tool type: a write gets one attempt only and reports that the outcome is unknown or failed; a read is retried up to twice with backoff, shown as a dashed arrow back to the tool step. Every path ends in one box: a tool result goes back to the model, either data or an error with its kind and whether a retry could help, and the model gives an honest answer, partial if it must, without seeing a stack trace.</desc>
  <!--
    Hand-authored source. Edit this file directly; there is no separate generator.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: solid arrows = steps, the dashed arrow = a retry, outlined boxes = code, the dashed box = untrusted.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ce6db"/></marker>
    <style>
      .head { font: 600 14px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .lbl { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .chk { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
      .ucy { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
      .note { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #d4d8cf; }
      .lane { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .untrusted { fill: #1d211b; stroke: #9ce6db; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .app { fill: #232822; stroke: #c7f36b; stroke-width: 1.6; }
      .step { stroke: #f0f0e8; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
  <rect width="760" height="590" fill="#171a16"/>

  <!-- Proposal and checks -->
  <rect class="untrusted" x="230" y="20" width="300" height="46" rx="3"/>
  <text class="head" x="380" y="40" text-anchor="middle">Model proposes a tool call</text>
  <text class="ucy" x="380" y="57" text-anchor="middle">name and arguments: untrusted</text>
  <line class="step" x1="380" y1="66" x2="380" y2="88" marker-end="url(#arrow)"/>

  <rect class="app" x="190" y="90" width="380" height="46" rx="3"/>
  <text class="head" x="380" y="110" text-anchor="middle">Runner checks</text>
  <text class="chk" x="380" y="127" text-anchor="middle">known tool · call limit · argument shape</text>
  <line class="step" x1="380" y1="136" x2="380" y2="158" marker-end="url(#arrow)"/>

  <rect class="app" x="230" y="160" width="300" height="46" rx="3"/>
  <text class="head" x="380" y="180" text-anchor="middle">Tool runs with a timeout</text>
  <text class="chk" x="380" y="197" text-anchor="middle">5 s per read attempt · 10 s per booking</text>

  <!-- Fan out -->
  <line class="step" x1="370" y1="206" x2="90" y2="248" marker-end="url(#arrow)"/>
  <line class="step" x1="376" y1="206" x2="235" y2="248" marker-end="url(#arrow)"/>
  <line class="step" x1="380" y1="206" x2="380" y2="248" marker-end="url(#arrow)"/>
  <line class="step" x1="390" y1="206" x2="596" y2="248" marker-end="url(#arrow)"/>

  <!-- Outcomes -->
  <rect class="lane" x="20" y="250" width="132" height="64" rx="3"/>
  <text class="head" x="86" y="272" text-anchor="middle">Success</text>
  <text class="sub" x="86" y="290" text-anchor="middle">returns data</text>

  <rect class="lane" x="167" y="250" width="132" height="64" rx="3"/>
  <text class="head" x="233" y="272" text-anchor="middle">Validation</text>
  <text class="sub" x="233" y="290" text-anchor="middle">bad arguments</text>
  <text class="chk" x="233" y="306" text-anchor="middle">no retry</text>

  <rect class="lane" x="314" y="250" width="132" height="64" rx="3"/>
  <text class="head" x="380" y="272" text-anchor="middle">Denied</text>
  <text class="sub" x="380" y="290" text-anchor="middle">not yours, refused</text>
  <text class="chk" x="380" y="306" text-anchor="middle">no retry</text>

  <rect class="lane" x="461" y="250" width="279" height="64" rx="3"/>
  <text class="head" x="600" y="272" text-anchor="middle">Timeout or upstream failure</text>
  <text class="sub" x="600" y="290" text-anchor="middle">no answer in time, or a carrier error</text>
  <text class="chk" x="600" y="306" text-anchor="middle">depends on the tool</text>
  <line class="step" x1="527" y1="314" x2="527" y2="342" marker-end="url(#arrow)"/>
  <line class="step" x1="674" y1="314" x2="674" y2="342" marker-end="url(#arrow)"/>

  <rect class="app" x="461" y="344" width="132" height="64" rx="3"/>
  <text class="head" x="527" y="366" text-anchor="middle">Write</text>
  <text class="sub" x="527" y="384" text-anchor="middle">one attempt only</text>
  <text class="chk" x="527" y="400" text-anchor="middle">outcome unknown</text>

  <rect class="app" x="608" y="344" width="132" height="64" rx="3"/>
  <text class="head" x="674" y="366" text-anchor="middle">Read</text>
  <text class="sub" x="674" y="384" text-anchor="middle">retry up to twice</text>
  <text class="chk" x="674" y="400" text-anchor="middle">with backoff</text>

  <!-- Retry loop for reads -->
  <path d="M740,376 H752 V183 H534" fill="none" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-cyan)"/>

  <!-- Everything ends as a result -->
  <line class="step" x1="86" y1="314" x2="86" y2="452" marker-end="url(#arrow)"/>
  <line class="step" x1="233" y1="314" x2="233" y2="452" marker-end="url(#arrow)"/>
  <line class="step" x1="380" y1="314" x2="380" y2="452" marker-end="url(#arrow)"/>
  <line class="step" x1="527" y1="408" x2="527" y2="452" marker-end="url(#arrow)"/>
  <line class="step" x1="674" y1="408" x2="674" y2="452" marker-end="url(#arrow)"/>

  <rect class="app" x="20" y="454" width="720" height="62" rx="3"/>
  <text class="lbl" x="36" y="478">Tool result back to the model: data, or an error with its kind and whether a retry could help</text>
  <text class="note" x="36" y="498">The model gives an honest answer, partial if it must. It never sees a stack trace.</text>

  <!-- Legend -->
  <line x1="20" y1="556" x2="50" y2="556" stroke="#f0f0e8" stroke-width="1.4"/>
  <text class="note" x="58" y="560">Solid: a step.</text>
  <line x1="170" y1="556" x2="200" y2="556" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="note" x="208" y="560">Dashed: a retry.</text>
  <rect x="340" y="549" width="26" height="14" class="app"/>
  <text class="note" x="374" y="560">Outlined: code.</text>
  <rect x="510" y="549" width="26" height="14" class="untrusted"/>
  <text class="note" x="544" y="560">Dashed box: untrusted.</text>
</svg>

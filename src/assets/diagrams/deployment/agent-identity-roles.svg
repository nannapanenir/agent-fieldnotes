  <line class="step" x1="250" y1="99.0" x2="288" y2="99.0" marker-end="url(#arrow)"/>
  <rect class="r" x="290" y="78" width="200" height="42" rx="3"/>
  <text class="role" x="390" y="103" text-anchor="middle">Foundry User</text>

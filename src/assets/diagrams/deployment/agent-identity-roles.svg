<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc">
  <title id="title">Who holds which role, at which scope, for the shipment agent as a hosted agent</title>
  <desc id="desc">Three columns: principal, role, and scope, with an arrow from each principal to its role and from the role to its scope. 1. Developer (human) holds Foundry User on Foundry project. 2. Release pipeline (workload identity) holds Foundry Project Manager on Foundry project. 3. Chat application (managed identity) holds Foundry Agent Consumer on one agent: shipment-hosted. 4. shipment-hosted (agent identity) holds Foundry User on Foundry resource (Claude). 5. shipment-hosted (agent identity) holds Shipments.Read app role on your shipment API. 6. Project identity (managed identity) holds Container Registry Repository Reader on container registry. 7. Project identity (managed identity) holds Log Analytics Data Reader on Log Analytics workspace. 8. Administrator (human, just in time) holds Role Based Access Control Administrator on resource group. Every principal type is written in text: human, workload identity, managed identity, or agent identity.</desc>
  <!-- Hand-authored source (generated once by a script, then kept as the source). Colors follow src/layouts/SiteLayout.astro. Principal types are written in text, not shown by color. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <style>
      .head { font: 600 14px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .name { font: 600 13px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .type { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
      .role { font: 500 11.5px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
      .scope { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .lbl { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .p { fill: #1d211b; stroke: #9ce6db; stroke-width: 1.3; }
      .r { fill: #232822; stroke: #c7f36b; stroke-width: 1.4; }
      .s { fill: #232822; stroke: #a4a99f; stroke-width: 1.2; }
      .step { stroke: #f0f0e8; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <line class="step" x1="490" y1="151.0" x2="518" y2="151.0" marker-end="url(#arrow)"/>
  <rect class="s" x="520" y="130" width="220" height="42" rx="3"/>
  <text class="scope" x="532" y="155">Foundry project</text>
  <rect class="p" x="20" y="182" width="230" height="42" rx="3"/>

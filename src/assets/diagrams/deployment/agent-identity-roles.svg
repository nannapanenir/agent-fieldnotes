  <text class="scope" x="532" y="415">Log Analytics workspace</text>
  <rect class="p" x="20" y="442" width="230" height="42" rx="3"/>
  <text class="name" x="32" y="459">Administrator</text>
  <text class="type" x="32" y="475">human, just in time</text>
  <line class="step" x1="250" y1="463.0" x2="288" y2="463.0" marker-end="url(#arrow)"/>
  <rect class="r" x="290" y="442" width="200" height="42" rx="3"/>
  <text class="role" x="390" y="460" text-anchor="middle">Role Based Access Control</text>
  <text class="role" x="390" y="474" text-anchor="middle">Administrator</text>
  <line class="step" x1="490" y1="463.0" x2="518" y2="463.0" marker-end="url(#arrow)"/>
  <rect class="s" x="520" y="442" width="220" height="42" rx="3"/>
  <text class="scope" x="532" y="467">resource group</text>
  <rect x="20" y="508" width="720" height="58" rx="3" fill="none" stroke="#a4a99f" stroke-width="1"/>
  <rect class="p" x="38" y="520" width="28" height="14" rx="2"/><text class="lbl" x="76" y="532">principal, with its type in text</text>
  <rect class="r" x="320" y="520" width="28" height="14" rx="2"/><text class="lbl" x="358" y="532">role it holds</text>
  <rect class="s" x="520" y="520" width="28" height="14" rx="2"/><text class="lbl" x="558" y="532">scope of that role</text>
  <text class="lbl" x="38" y="554">Read each row left to right: who, what they may do, and where. The table in the article is the full text equivalent.</text>

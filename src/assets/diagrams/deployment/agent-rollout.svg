<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Releasing version 2 and rolling back, on Foundry and on Container Apps</title>
  <desc id="desc">Two rows. Foundry hosted agent: an endpoint sends 100 percent of traffic to one version, because traffic splitting between versions isn't supported. Step 1, pin the endpoint to version 1 at 100 percent. Step 2, deploy version 2, which receives no traffic. Step 3, test version 2 in a session pinned to it. Step 4, promote: the endpoint selector moves to version 2 at 100 percent. Rollback restores the selector to version 1; sessions already started stay on their version. For a share of customers on a new version, your application can pin the version per request for a cohort, for prompt agents through the agent reference. Container Apps: step 1, version 1 at 100 percent. Step 2, revision 2 at 10 percent and revision 1 at 90 percent, by revision weight. Step 3, revision 2 at 100 percent. Rollback sets revision 1 back to 100 percent.</desc>
  <!--
    Hand-authored source. Colors follow src/layouts/SiteLayout.astro.
    Solid arrows = promotion; dashed arrows = rollback. Percentages are written in each box.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <marker id="arrow-acid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c7f36b"/></marker>
    <style>
      .head { font: 600 14px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .big { font: 600 15px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .chk { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
      .lbl { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .box { fill: #232822; stroke: #a4a99f; stroke-width: 1.2; }
      .step { stroke: #f0f0e8; stroke-width: 1.4; fill: none; }
      .back { stroke: #c7f36b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .lane { fill: #1b1f19; stroke: #a4a99f; stroke-width: 1; }
    </style>
  </defs>
  <rect width="760" height="470" fill="#171a16"/>

  <rect class="lane" x="20" y="20" width="720" height="200" rx="6"/>
  <text class="big" x="36" y="44">Foundry hosted agent</text>
  <text class="sub" x="200" y="44">one version gets 100%; no percentage split</text>
  <rect class="box" x="36" y="62" width="156" height="64" rx="3"/><text class="head" x="48" y="84">1. Pin v1</text><text class="chk" x="48" y="104">v1: 100%</text>
  <rect class="box" x="214" y="62" width="156" height="64" rx="3"/><text class="head" x="226" y="84">2. Deploy v2</text><text class="sub" x="226" y="104">v2: no traffic</text>
  <rect class="box" x="392" y="62" width="156" height="64" rx="3"/><text class="head" x="404" y="84">3. Test v2</text><text class="sub" x="404" y="104">pinned test session</text>
  <rect class="box" x="570" y="62" width="156" height="64" rx="3"/><text class="head" x="582" y="84">4. Promote</text><text class="chk" x="582" y="104">v2: 100%</text>
  <line class="step" x1="192" y1="94" x2="212" y2="94" marker-end="url(#arrow)"/>
  <line class="step" x1="370" y1="94" x2="390" y2="94" marker-end="url(#arrow)"/>
  <line class="step" x1="548" y1="94" x2="568" y2="94" marker-end="url(#arrow)"/>
  <polyline class="back" points="648,126 648,150 114,150 114,128" marker-end="url(#arrow-acid)"/>
  <text class="lbl" x="250" y="172">Rollback: restore the selector to v1. Existing sessions keep their version.</text>
  <text class="sub" x="36" y="198">A cohort on v2 first: your app pins the version per request (prompt agents: agent_reference.version).</text>

  <rect class="lane" x="20" y="240" width="720" height="170" rx="6"/>
  <text class="big" x="36" y="264">Container Apps</text>
  <text class="sub" x="170" y="264">multiple revision mode; weights must total 100%</text>
  <rect class="box" x="36" y="282" width="200" height="64" rx="3"/><text class="head" x="48" y="304">1. Revision 1</text><text class="chk" x="48" y="324">rev 1: 100%</text>
  <rect class="box" x="276" y="282" width="200" height="64" rx="3"/><text class="head" x="288" y="304">2. Canary</text><text class="chk" x="288" y="324">rev 2: 10%, rev 1: 90%</text>
  <rect class="box" x="516" y="282" width="210" height="64" rx="3"/><text class="head" x="528" y="304">3. Full rollout</text><text class="chk" x="528" y="324">rev 2: 100%</text>
  <line class="step" x1="236" y1="314" x2="274" y2="314" marker-end="url(#arrow)"/>
  <line class="step" x1="476" y1="314" x2="514" y2="314" marker-end="url(#arrow)"/>
  <polyline class="back" points="376,346 376,370 136,370 136,348" marker-end="url(#arrow-acid)"/>
  <text class="lbl" x="400" y="392">Rollback: rev 1 back to 100%.</text>

  <rect x="20" y="424" width="720" height="34" rx="3" fill="none" stroke="#a4a99f" stroke-width="1"/>
  <line class="step" x1="36" y1="441" x2="76" y2="441" marker-end="url(#arrow)"/><text class="lbl" x="86" y="445">promotion</text>
  <line class="back" x1="200" y1="441" x2="240" y2="441" marker-end="url(#arrow-acid)"/><text class="lbl" x="250" y="445">rollback</text>
</svg>

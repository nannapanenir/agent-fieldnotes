<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">The five parts of Microsoft Foundry and where they live</title>
  <desc id="desc">Diagram of a Foundry resource, the Azure resource of type Microsoft.CognitiveServices/accounts with kind AIServices. Across its top runs part 5, Foundry governance, formerly called the Foundry Control Plane: agent identity, access policies, cost, and guardrails, applied across the resource and its projects. Inside the resource are part 1, model deployments from Foundry Models, shared by every project, and two projects. Each project holds part 2, Foundry Agent Service, with prompt agents, voice-based prompt agents, and hosted agents, and part 3, Toolbox, the tools an agent may call, such as web search, file search, MCP servers, and OpenAPI tools. Outside the Foundry resource boundary, as separate Azure resources with their own networking and access settings, are part 4, Foundry IQ, formerly Azure AI Search, which holds knowledge bases for retrieval, plus Azure Storage and Azure Key Vault. Projects reach them through connections.</desc>
  <!--
    Hand-authored source. Edit this file directly; there is no separate generator.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Numbers 1 to 5 match the five parts in the article. Solid outline = inside the Foundry resource; dashed outline = a separate Azure resource.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <style>
      .head { font: 600 14px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .big { font: 600 16px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .chk { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
      .ucy { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
      .lbl { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .num { font: 600 12px 'DM Mono', ui-monospace, monospace; fill: #171a16; }
      .res { fill: #1d211b; stroke: #c7f36b; stroke-width: 1.6; }
      .proj { fill: #232822; stroke: #a4a99f; stroke-width: 1.2; }
      .part { fill: #2a3028; stroke: #a4a99f; stroke-width: 1; }
      .gov { fill: #232822; stroke: #9ce6db; stroke-width: 1.4; }
      .ext { fill: #1d211b; stroke: #a4a99f; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .badge { fill: #c7f36b; stroke: #171a16; stroke-width: 2; }
      .conn { stroke: #f0f0e8; stroke-width: 1.3; fill: none; }
    </style>
  </defs>
  <rect width="760" height="600" fill="#171a16"/>

  <!-- Foundry resource -->
  <rect class="res" x="20" y="20" width="500" height="490" rx="6"/>
  <text class="big" x="40" y="46">Foundry resource</text>
  <text class="sub" x="40" y="64">Microsoft.CognitiveServices/accounts · kind AIServices</text>

  <!-- 5 governance -->
  <rect class="gov" x="40" y="80" width="460" height="54" rx="3"/>
  <circle class="badge" cx="62" cy="107" r="11"/><text class="num" x="62" y="111" text-anchor="middle">5</text>
  <text class="head" x="82" y="102">Foundry governance</text>
  <text class="ucy" x="82" y="120">identity · access policies · cost · guardrails</text>

  <!-- 1 models -->
  <rect class="part" x="40" y="148" width="460" height="54" rx="3"/>
  <circle class="badge" cx="62" cy="175" r="11"/><text class="num" x="62" y="179" text-anchor="middle">1</text>
  <text class="head" x="82" y="170">Model deployments from Foundry Models</text>
  <text class="sub" x="82" y="188">shared by every project in the resource</text>

  <!-- Projects -->
  <rect class="proj" x="40" y="218" width="222" height="276" rx="4"/>
  <text class="head" x="56" y="242">Project A</text>
  <text class="sub" x="56" y="259">development boundary</text>
  <rect class="part" x="54" y="272" width="194" height="96" rx="3"/>
  <circle class="badge" cx="74" cy="292" r="11"/><text class="num" x="74" y="296" text-anchor="middle">2</text>
  <text class="head" x="92" y="297">Agent Service</text>
  <text class="sub" x="66" y="320">prompt agents</text>
  <text class="sub" x="66" y="336">voice-based prompt agents</text>
  <text class="sub" x="66" y="352">hosted agents</text>
  <rect class="part" x="54" y="380" width="194" height="100" rx="3"/>
  <circle class="badge" cx="74" cy="400" r="11"/><text class="num" x="74" y="404" text-anchor="middle">3</text>
  <text class="head" x="92" y="405">Toolbox</text>
  <text class="sub" x="66" y="428">web and file search</text>
  <text class="sub" x="66" y="444">MCP servers</text>
  <text class="sub" x="66" y="460">OpenAPI tools</text>

  <rect class="proj" x="278" y="218" width="222" height="276" rx="4"/>
  <text class="head" x="294" y="242">Project B</text>
  <text class="sub" x="294" y="259">same parts, own assets</text>
  <rect class="part" x="292" y="272" width="194" height="96" rx="3"/>
  <circle class="badge" cx="312" cy="292" r="11"/><text class="num" x="312" y="296" text-anchor="middle">2</text>
  <text class="head" x="330" y="297">Agent Service</text>
  <text class="sub" x="304" y="320">agents, conversations</text>
  <text class="sub" x="304" y="336">evaluations, files</text>
  <rect class="part" x="292" y="380" width="194" height="100" rx="3"/>
  <circle class="badge" cx="312" cy="400" r="11"/><text class="num" x="312" y="404" text-anchor="middle">3</text>
  <text class="head" x="330" y="405">Toolbox</text>
  <text class="sub" x="304" y="428">its own curated tools</text>

  <!-- Connected resources -->
  <text class="lbl" x="550" y="46">Separate Azure resources</text>
  <text class="sub" x="550" y="64">own networking and access</text>
  <rect class="ext" x="550" y="218" width="190" height="96" rx="3"/>
  <circle class="badge" cx="570" cy="240" r="11"/><text class="num" x="570" y="244" text-anchor="middle">4</text>
  <text class="head" x="588" y="245">Foundry IQ</text>
  <text class="sub" x="564" y="268">formerly Azure AI Search</text>
  <text class="sub" x="564" y="284">knowledge bases,</text>
  <text class="sub" x="564" y="300">agentic retrieval</text>
  <rect class="ext" x="550" y="330" width="190" height="46" rx="3"/>
  <text class="head" x="645" y="358" text-anchor="middle">Azure Storage</text>
  <rect class="ext" x="550" y="392" width="190" height="46" rx="3"/>
  <text class="head" x="645" y="420" text-anchor="middle">Azure Key Vault</text>
  <polyline class="conn" points="500,300 525,300 525,266 548,266" marker-end="url(#arrow)"/>
  <polyline class="conn" points="525,300 525,353 548,353" marker-end="url(#arrow)"/>
  <polyline class="conn" points="525,353 525,415 548,415" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="528" width="720" height="58" rx="3" fill="none" stroke="#a4a99f" stroke-width="1"/>
  <rect class="res" x="38" y="542" width="28" height="14" rx="2"/>
  <text class="lbl" x="76" y="554">inside the Foundry resource</text>
  <rect class="ext" x="290" y="542" width="28" height="14" rx="2"/>
  <text class="lbl" x="328" y="554">separate resource, reached by a connection</text>
  <circle class="badge" cx="50" cy="572" r="9"/><text class="num" x="50" y="576" text-anchor="middle">1</text>
  <text class="lbl" x="66" y="576">numbers match the five parts in the text</text>
  <line class="conn" x1="390" y1="572" x2="430" y2="572" marker-end="url(#arrow)"/>
  <text class="lbl" x="440" y="576">project connection</text>
</svg>

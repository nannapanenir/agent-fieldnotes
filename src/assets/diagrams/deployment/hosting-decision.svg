<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a hosting option for the shipment agent</title>
  <desc id="desc">Decision flowchart with two questions. Question 1: does the agent need your own code inside its loop, such as budgets, an approval step, or custom checks? If it doesn't, the answer is a Foundry prompt agent, where your tools are an API or MCP server with their own checks, or functions your application runs. If it does, go to question 2: do you want Foundry to run that code, with a managed endpoint, a per-agent Entra identity, sessions, and Foundry governance, in a region where hosted agents are available? If yes, the answer is a Foundry hosted agent. If you need your own ingress and authentication, a region without hosted agents, or an existing Container Apps platform, the answer is your own container on Azure Container Apps.</desc>
  <!--
    Hand-authored source. Colors follow src/layouts/SiteLayout.astro.
    No labels on arrows: each answer box starts with the condition that leads to it ("If no", "If yes").
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <style>
      .head { font: 600 14px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .chk { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
      .q { fill: #1d211b; stroke: #9ce6db; stroke-width: 1.5; }
      .a { fill: #232822; stroke: #c7f36b; stroke-width: 1.6; }
      .step { stroke: #f0f0e8; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
  <rect width="760" height="470" fill="#171a16"/>

  <rect class="q" x="170" y="20" width="420" height="62" rx="3"/>
  <text class="head" x="380" y="42" text-anchor="middle">1. Does the agent need your own code in its loop?</text>
  <text class="sub" x="380" y="62" text-anchor="middle">budgets, an approval step, custom checks</text>

  <line class="step" x1="280" y1="82" x2="160" y2="118" marker-end="url(#arrow)"/>
  <line class="step" x1="480" y1="82" x2="560" y2="118" marker-end="url(#arrow)"/>

  <rect class="a" x="20" y="120" width="290" height="96" rx="3"/>
  <text class="chk" x="36" y="142">If no</text>
  <text class="head" x="36" y="164">Foundry prompt agent</text>
  <text class="sub" x="36" y="184">tools: your API or MCP server with</text>
  <text class="sub" x="36" y="200">its own checks, or app-run functions</text>

  <rect class="q" x="350" y="120" width="390" height="96" rx="3"/>
  <text class="chk" x="366" y="142">If yes</text>
  <text class="head" x="366" y="164">2. Should Foundry run that code?</text>
  <text class="sub" x="366" y="184">managed endpoint, agent identity,</text>
  <text class="sub" x="366" y="200">sessions, governance, supported region</text>

  <line class="step" x1="470" y1="216" x2="380" y2="268" marker-end="url(#arrow)"/>
  <line class="step" x1="640" y1="216" x2="640" y2="268" marker-end="url(#arrow)"/>

  <rect class="a" x="240" y="270" width="250" height="96" rx="3"/>
  <text class="chk" x="256" y="292">If yes</text>
  <text class="head" x="256" y="314">Foundry hosted agent</text>
  <text class="sub" x="256" y="334">your container, run by Foundry</text>
  <text class="sub" x="256" y="350">in a VM-isolated session sandbox</text>

  <rect class="a" x="510" y="270" width="230" height="96" rx="3"/>
  <text class="chk" x="526" y="292">If no</text>
  <text class="head" x="526" y="314">Azure Container Apps</text>
  <text class="sub" x="526" y="334">your container, your ingress,</text>
  <text class="sub" x="526" y="350">auth, identity, and network</text>

  <rect x="20" y="394" width="720" height="58" rx="3" fill="none" stroke="#a4a99f" stroke-width="1"/>
  <rect class="q" x="38" y="414" width="28" height="16" rx="2"/>
  <text class="sub" x="76" y="426" style="fill:#f0f0e8;font-family:'DM Sans',system-ui,sans-serif;font-size:12px">question</text>
  <rect class="a" x="190" y="414" width="28" height="16" rx="2"/>
  <text class="sub" x="228" y="426" style="fill:#f0f0e8;font-family:'DM Sans',system-ui,sans-serif;font-size:12px">answer; its first line names the condition that leads to it</text>
</svg>

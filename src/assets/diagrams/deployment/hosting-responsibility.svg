<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" role="img" aria-labelledby="title desc">
  <title id="title">Who manages what in the three Azure hosting options</title>
  <desc id="desc">Grid comparing three ways to host the shipment agent on Azure: a Foundry prompt agent, a Foundry hosted agent, and your own container on Azure Container Apps. Each row is a layer, and each cell says You, Azure, or Both. Endpoint and authentication: Azure for the prompt agent and the hosted agent, which use Microsoft Entra ID, and You for Container Apps, where you configure ingress and authentication. Orchestration code: Azure runs the prompt agent from your configuration; for the hosted agent and Container Apps it is your container. Runtime and compute: Azure for the prompt agent and the hosted agent, which runs each session in its own sandbox; Both for Container Apps, where Azure runs the containers and you set scale rules. Runtime identity: Azure creates an agent identity for the prompt agent and the hosted agent; for Container Apps you enable and grant a managed identity. Network: Both for the two Foundry options, through the Foundry resource rules and, for hosted agents, your virtual network for outbound traffic; You for Container Apps, through the environment virtual network. Telemetry: Both for the Foundry options, with Foundry tracing, plus your own OpenTelemetry for hosted agents; You for Container Apps. Image and patching: no image for the prompt agent; your image and dependencies for the hosted agent and Container Apps.</desc>

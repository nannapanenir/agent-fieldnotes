<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">Deploying and calling the shipment assistant as a Foundry prompt agent</title>
  <desc id="desc">Two columns. On the left, your side: an admin identity, a deployer identity, your chat application with the Stage 4 tool runner, and your shipment records and carrier. On the right, the Foundry project: the gpt-5-mini model deployment, the stored agent definition, and the conversation. Step 1: the admin creates the resource group, Foundry resource, project, and model deployment. Step 2: the admin assigns roles, Foundry User to the deployer and Foundry Agent Consumer to the application's identity. Step 3: the deployer creates an agent version that stores the instructions, the model name, and three function tool descriptions. Step 4: the application, acting for a signed-in customer, sends the question with an agent reference. Step 5: Foundry runs the agent, which calls the model and returns a function call, which is untrusted. Step 6: the application runs the tool itself, with the ownership check, call limits, and approval prompt, against your records and the carrier. Step 7: the application sends the function output back, and the agent answers. Step 8: you check the result and traces, then delete the resource group to clean up.</desc>
  <!--
    Hand-authored source. Colors follow src/layouts/SiteLayout.astro.
    Numbered badges 1 to 8 match the tutorial steps; arrows carry no labels. Dashed outline = untrusted output.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <style>
      .head { font: 600 14px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .big { font: 600 15px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .chk { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
      .ucy { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
      .lbl { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .num { font: 600 12px 'DM Mono', ui-monospace, monospace; fill: #171a16; }
      .zone { fill: #1b1f19; stroke: #a4a99f; stroke-width: 1; }
      .app { fill: #232822; stroke: #c7f36b; stroke-width: 1.6; }
      .box { fill: #232822; stroke: #a4a99f; stroke-width: 1.2; }
      .untrusted { fill: #1d211b; stroke: #9ce6db; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .badge { fill: #c7f36b; stroke: #171a16; stroke-width: 2; }
      .step { stroke: #f0f0e8; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
  <rect width="760" height="620" fill="#171a16"/>

  <rect class="zone" x="20" y="20" width="330" height="500" rx="6"/>
  <text class="big" x="38" y="46">Your side</text>
  <rect class="zone" x="410" y="20" width="330" height="500" rx="6"/>
  <text class="big" x="428" y="46">Foundry project</text>

  <!-- Left boxes -->
  <rect class="box" x="38" y="64" width="294" height="46" rx="3"/>
  <text class="head" x="54" y="84">Admin (you, with az)</text>
  <text class="sub" x="54" y="101">Owner on the resource group</text>
  <rect class="box" x="38" y="150" width="294" height="46" rx="3"/>
  <text class="head" x="54" y="170">Deployer (you, or CI)</text>
  <text class="sub" x="54" y="187">Foundry User</text>
  <rect class="app" x="38" y="250" width="294" height="110" rx="3"/>
  <text class="head" x="54" y="272">Code: your chat app</text>
  <text class="chk" x="54" y="291">identity: Foundry Agent Consumer</text>
  <text class="chk" x="54" y="309">customer ID from sign-in</text>
  <text class="chk" x="54" y="327">Stage 4 tool runner: ownership,</text>
  <text class="chk" x="54" y="345">limits, approval prompt</text>
  <rect class="box" x="38" y="420" width="294" height="46" rx="3"/>
  <text class="head" x="54" y="440">Your records and the carrier</text>
  <text class="sub" x="54" y="457">read and booked only by your code</text>

  <!-- Right boxes -->
  <rect class="box" x="428" y="64" width="294" height="46" rx="3"/>
  <text class="head" x="444" y="84">Model deployment</text>
  <text class="sub" x="444" y="101">gpt-5-mini, Global Standard</text>
  <rect class="box" x="428" y="150" width="294" height="62" rx="3"/>
  <text class="head" x="444" y="170">Agent: shipment-assistant</text>
  <text class="sub" x="444" y="187">instructions, model name,</text>
  <text class="sub" x="444" y="202">3 function tool descriptions</text>
  <rect class="box" x="428" y="250" width="294" height="46" rx="3"/>
  <text class="head" x="444" y="270">Conversation</text>
  <text class="sub" x="444" y="287">Foundry runs the loop, calls the model</text>
  <rect class="untrusted" x="428" y="330" width="294" height="46" rx="3"/>
  <text class="head" x="444" y="350">Function call or answer</text>
  <text class="ucy" x="444" y="367">model output: untrusted</text>

  <!-- 1 admin creates resources -->
  <line class="step" x1="332" y1="80" x2="426" y2="80" marker-end="url(#arrow)"/>
  <circle class="badge" cx="380" cy="80" r="11"/><text class="num" x="380" y="84" text-anchor="middle">1</text>
  <!-- 2 admin assigns roles -->
  <line class="step" x1="185" y1="110" x2="185" y2="148" marker-end="url(#arrow)"/>
  <circle class="badge" cx="185" cy="129" r="11"/><text class="num" x="185" y="133" text-anchor="middle">2</text>
  <!-- 3 deployer creates agent version -->
  <line class="step" x1="332" y1="174" x2="426" y2="174" marker-end="url(#arrow)"/>
  <circle class="badge" cx="380" cy="174" r="11"/><text class="num" x="380" y="178" text-anchor="middle">3</text>
  <!-- 4 app sends question -->
  <line class="step" x1="332" y1="272" x2="426" y2="272" marker-end="url(#arrow)"/>
  <circle class="badge" cx="380" cy="272" r="11"/><text class="num" x="380" y="276" text-anchor="middle">4</text>
  <!-- 5 function call back -->
  <polyline class="step" points="428,353 380,353 380,320 334,320" marker-end="url(#arrow)"/>
  <circle class="badge" cx="380" cy="337" r="11"/><text class="num" x="380" y="341" text-anchor="middle">5</text>
  <!-- 6 app runs the tool -->
  <line class="step" x1="185" y1="360" x2="185" y2="418" marker-end="url(#arrow)"/>
  <circle class="badge" cx="185" cy="389" r="11"/><text class="num" x="185" y="393" text-anchor="middle">6</text>
  <!-- 7 output back -->
  <polyline class="step" points="332,345 360,345 360,400 575,400 575,378" marker-end="url(#arrow)"/>
  <circle class="badge" cx="470" cy="400" r="11"/><text class="num" x="470" y="404" text-anchor="middle">7</text>
  <!-- conversation to model -->
  <line class="step" x1="575" y1="250" x2="575" y2="214" marker-end="url(#arrow)"/>
  <line class="step" x1="575" y1="296" x2="575" y2="328" marker-end="url(#arrow)"/>

  <!-- 8 verify and clean up -->
  <rect class="box" x="428" y="440" width="294" height="62" rx="3"/>
  <circle class="badge" cx="448" cy="461" r="11"/><text class="num" x="448" y="465" text-anchor="middle">8</text>
  <text class="head" x="466" y="466">Verify, then clean up</text>
  <text class="sub" x="444" y="490">check traces, delete the group</text>

  <!-- Legend -->
  <rect x="20" y="536" width="720" height="70" rx="3" fill="none" stroke="#a4a99f" stroke-width="1"/>
  <circle class="badge" cx="42" cy="558" r="10"/><text class="num" x="42" y="562" text-anchor="middle">1</text>
  <text class="lbl" x="60" y="562">numbers match the tutorial steps</text>
  <rect class="app" x="300" y="550" width="28" height="16" rx="2"/>
  <text class="lbl" x="338" y="562">Code: runs in your application</text>
  <rect class="untrusted" x="560" y="550" width="28" height="16" rx="2"/>
  <text class="lbl" x="598" y="562">untrusted output</text>
  <rect class="box" x="32" y="578" width="28" height="16" rx="2"/>
  <text class="lbl" x="70" y="590">identity or stored resource</text>
  <rect class="zone" x="300" y="578" width="28" height="16" rx="2"/>
  <text class="lbl" x="338" y="590">who owns the boxes inside: you, or Foundry</text>
</svg>

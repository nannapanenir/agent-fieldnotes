<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">What a sandbox blocks and allows when an agent runs code</title>
  <desc id="desc">Nested boxes. The outer box is the host, your infrastructure, which holds secrets, the internal network, and other customers' data. Inside it is the sandbox, a container, gVisor, or microVM, with limits on CPU, memory, disk, processes, and wall-clock time. Inside the sandbox is the process running model-written code, which is untrusted and can write only to its workspace. Dashed lines from the process to secrets, the host file system, and the internal network are each blocked at the sandbox wall: no secrets are mounted, only the workspace is writable, and network egress is denied. One solid arrow passes through the wall to an allowed destination: a carrier data API, one host, read-only.</desc>
  <!--
    Hand-authored source. Edit this file directly; there is no separate generator.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: blocked paths are dashed with a cross at the sandbox wall and say "blocked";
    the allowed path is a solid arrow and says "allowed"; the untrusted process is dashed and says "untrusted".
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <style>
      .node { font: 600 13px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .usub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
      .ctl { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
      .note { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #d4d8cf; }
      .host { fill: #1b1f19; stroke: #a4a99f; stroke-width: 1; }
      .sandbox { fill: #232822; stroke: #c7f36b; stroke-width: 1.8; }
      .proc { fill: #1d211b; stroke: #9ce6db; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .res { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .blocked { stroke: #a4a99f; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
      .cross { stroke: #f0f0e8; stroke-width: 2.2; }
    </style>
  </defs>
  <rect width="760" height="520" fill="#171a16"/>

  <!-- Host -->
  <rect class="host" x="20" y="24" width="720" height="430" rx="6"/>
  <text class="node" x="36" y="48">Host: your infrastructure</text>
  <text class="sub" x="36" y="66">secrets, internal network, other customers' data</text>

  <!-- Sandbox -->
  <rect class="sandbox" x="220" y="90" width="320" height="320" rx="4"/>
  <text class="node" x="236" y="114">Sandbox</text>
  <text class="sub" x="236" y="132">container, gVisor, or microVM</text>
  <text class="ctl" x="236" y="372">limits: CPU, memory, disk,</text>
  <text class="ctl" x="236" y="388">processes, wall-clock time</text>

  <!-- Process -->
  <rect class="proc" x="280" y="175" width="200" height="120" rx="3"/>
  <text class="node" x="296" y="200">Process</text>
  <text class="usub" x="296" y="219">model-written code</text>
  <text class="usub" x="296" y="235">untrusted</text>
  <text class="sub" x="296" y="262">writes only to</text>
  <text class="sub" x="296" y="278">/workspace</text>

  <!-- Resources outside the sandbox -->
  <rect class="res" x="36" y="110" width="154" height="64" rx="3"/>
  <text class="node" x="50" y="133">Secrets</text>
  <text class="sub" x="50" y="151">blocked:</text>
  <text class="sub" x="50" y="165">none mounted</text>

  <rect class="res" x="36" y="292" width="154" height="64" rx="3"/>
  <text class="node" x="50" y="315">Host files</text>
  <text class="sub" x="50" y="333">blocked: only</text>
  <text class="sub" x="50" y="347">workspace writable</text>

  <rect class="res" x="570" y="110" width="154" height="64" rx="3"/>
  <text class="node" x="584" y="133">Internal network</text>
  <text class="sub" x="584" y="151">blocked:</text>
  <text class="sub" x="584" y="165">egress denied</text>

  <rect class="res" x="570" y="292" width="154" height="64" rx="3"/>
  <text class="node" x="584" y="315">Carrier data API</text>
  <text class="ctl" x="584" y="333">allowed: one host,</text>
  <text class="ctl" x="584" y="347">read-only</text>

  <!-- Paths -->
  <line class="blocked" x1="280" y1="200" x2="190" y2="142"/>
  <path class="cross" d="M214,155 L226,167 M226,155 L214,167"/>
  <line class="blocked" x1="280" y1="270" x2="190" y2="324"/>
  <path class="cross" d="M214,300 L226,312 M226,300 L214,312"/>
  <line class="blocked" x1="480" y1="200" x2="570" y2="142"/>
  <path class="cross" d="M534,155 L546,167 M546,155 L534,167"/>
  <line x1="480" y1="270" x2="566" y2="322" stroke="#f0f0e8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line class="blocked" x1="20" y1="482" x2="50" y2="482"/>
  <path class="cross" d="M29,476 L41,488 M41,476 L29,488"/>
  <text class="note" x="60" y="486">Dashed with a cross: blocked at the sandbox wall.</text>
  <line x1="440" y1="482" x2="470" y2="482" stroke="#f0f0e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="note" x="480" y="486">Solid arrow: allowed path.</text>
</svg>

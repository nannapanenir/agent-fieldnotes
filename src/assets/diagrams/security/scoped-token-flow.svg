<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">A user-scoped token flowing to a tool service</title>
  <desc id="desc">Sequence diagram with four lanes: user, application, model, and shipment tool service. The user signs in to the application. The application sends the model context and tool definitions but no tokens. The model proposes a getShipmentStatus call. The application checks the schema and policy, then calls the tool service with a short-lived token scoped to this user and to reading shipments. The tool service checks that the shipment belongs to the user and returns status data, which the application treats as untrusted. The model then proposes requestRedelivery. The application pauses at a human checkpoint and asks the user to approve. After the user approves, the application calls the tool service with a separate write-scoped token and an idempotency key. The model never sees a token.</desc>
  <!--
    Hand-authored source. Edit this file directly; there is no separate generator.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: dashed arrows = proposals or untrusted results (also labeled),
    checks are boxed and labeled, the human checkpoint is labeled.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ce6db"/></marker>
    <style>
      .head { font: 600 13px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .msg { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #f0f0e8; }
      .umsg { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #9ce6db; }
      .chk { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
      .note { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #d4d8cf; }
      .lane { fill: #1d211b; stroke: #a4a99f; stroke-width: 1; }
      .app { fill: #232822; stroke: #c7f36b; stroke-width: 1.4; }
      .life { stroke: rgba(235,243,225,.22); stroke-width: 1; stroke-dasharray: 3 4; }
      .human { fill: #232822; stroke: #f0f0e8; stroke-width: 2.2; }
    </style>
  </defs>

  <rect width="760" height="620" fill="#171a16"/>

  <!-- Lane heads -->
  <rect class="lane" x="35" y="20" width="110" height="40" rx="3"/>
  <text class="head" x="90" y="45" text-anchor="middle">User</text>
  <rect class="app" x="215" y="20" width="130" height="40" rx="3"/>
  <text class="head" x="280" y="45" text-anchor="middle">Application</text>
  <rect class="lane" x="415" y="20" width="110" height="40" rx="3"/>
  <text class="head" x="470" y="45" text-anchor="middle">Model</text>
  <rect class="lane" x="585" y="20" width="150" height="40" rx="3"/>
  <text class="head" x="660" y="45" text-anchor="middle">Shipment service</text>

  <line class="life" x1="90" y1="60" x2="90" y2="560"/>
  <line class="life" x1="280" y1="60" x2="280" y2="560"/>
  <line class="life" x1="470" y1="60" x2="470" y2="560"/>
  <line class="life" x1="660" y1="60" x2="660" y2="560"/>

  <!-- 1 sign in -->
  <text class="msg" x="185" y="94" text-anchor="middle">1  signs in</text>
  <line x1="90" y1="102" x2="276" y2="102" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 2 context -->
  <text class="msg" x="375" y="136" text-anchor="middle">2  context + tools, no tokens</text>
  <line x1="280" y1="144" x2="466" y2="144" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 3 proposal -->
  <text class="umsg" x="375" y="178" text-anchor="middle">3  proposes getShipmentStatus</text>
  <line x1="470" y1="186" x2="284" y2="186" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)"/>

  <!-- 4 app check -->
  <rect class="app" x="200" y="200" width="160" height="28" rx="3"/>
  <text class="chk" x="280" y="218" text-anchor="middle">4  check schema + policy</text>

  <!-- 5 scoped call -->
  <text class="msg" x="470" y="254" text-anchor="middle">5  read call + user token (shipments:read, 5 min)</text>
  <line x1="280" y1="262" x2="656" y2="262" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 6 owner check -->
  <rect class="app" x="570" y="276" width="180" height="28" rx="3"/>
  <text class="chk" x="660" y="294" text-anchor="middle">6  user owns shipment?</text>

  <!-- 7 result -->
  <text class="umsg" x="470" y="330" text-anchor="middle">7  status data, treated as untrusted</text>
  <line x1="660" y1="338" x2="284" y2="338" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)"/>

  <!-- 8 write proposal -->
  <text class="umsg" x="375" y="372" text-anchor="middle">8  proposes requestRedelivery</text>
  <line x1="470" y1="380" x2="284" y2="380" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)"/>

  <!-- 9 human checkpoint -->
  <rect class="human" x="40" y="398" width="190" height="34" rx="3"/>
  <text class="chk" x="135" y="420" text-anchor="middle" style="fill:#f0f0e8">9  Human checkpoint</text>
  <line x1="280" y1="415" x2="234" y2="415" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="msg" x="185" y="462" text-anchor="middle">10  approves</text>
  <line x1="90" y1="470" x2="276" y2="470" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 11 write call -->
  <text class="msg" x="470" y="504" text-anchor="middle">11  write call + new token (redelivery:write)</text>
  <text class="msg" x="470" y="520" text-anchor="middle">+ idempotency key</text>
  <line x1="280" y1="528" x2="656" y2="528" stroke="#f0f0e8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="35" y1="582" x2="65" y2="582" stroke="#9ce6db" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="note" x="73" y="586">Dashed: a proposal or an untrusted result.</text>
  <text class="note" x="420" y="586">The model never sees a token.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">Trust boundaries in a tool-using assistant</title>
  <desc id="desc">The application server sits in the center inside its own trust boundary and contains identity and permission checks, schema validation and limits, the tool gateway, approval logic, and redacted logging. Each surrounding zone is a separate trust boundary. The user sends a signed-in request. The application sends context to the model provider and receives proposed actions, which are untrusted. Retrieved content such as web pages, files, and documents flows in as untrusted content. The application calls read-only tools with scoped access and calls write tools only after approval, and tool results are untrusted. A human approval path approves or rejects high-impact actions. Memory, databases, logs, and secrets are accessed with least privilege, minimization, and redaction.</desc>
  <!--
    Hand-authored source. Edit this file directly; there is no separate generator.
    Colors follow src/layouts/SiteLayout.astro: bg #171a16, ink #f0f0e8, muted #a4a99f, acid #c7f36b, cyan #9ce6db.
    Meaning never depends on color: every dashed box is a trust boundary, and untrusted flows say "untrusted" and use dashed arrows.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0f0e8"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a4a99f"/>
    </marker>
    <style>
      .zone { fill: #1d211b; stroke: #a4a99f; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .head { font: 600 14px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .sub { font: 400 11px 'DM Mono', ui-monospace, monospace; fill: #a4a99f; }
      .item { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; }
      .lbl { font: 500 12px 'DM Sans', system-ui, sans-serif; fill: #f0f0e8; paint-order: stroke; stroke: #171a16; stroke-width: 5px; stroke-linejoin: round; }
      .lbl-untrusted { font: 600 12px 'DM Sans', system-ui, sans-serif; fill: #9ce6db; paint-order: stroke; stroke: #171a16; stroke-width: 5px; stroke-linejoin: round; }
      .tag { font: 500 11px 'DM Mono', ui-monospace, monospace; fill: #c7f36b; }
    </style>
  </defs>

  <rect width="760" height="640" fill="#171a16"/>

  <!-- External zones (each dashed box is its own trust boundary) -->
  <rect class="zone" x="250" y="20" width="260" height="70" rx="4"/>
  <text class="head" x="380" y="49" text-anchor="middle">Model provider</text>
  <text class="sub" x="380" y="70" text-anchor="middle">sees only the context you send</text>

  <rect class="zone" x="545" y="20" width="195" height="70" rx="4"/>
  <text class="head" x="642" y="49" text-anchor="middle">Retrieved content</text>
  <text class="sub" x="642" y="70" text-anchor="middle">web pages · files · docs</text>

  <rect class="zone" x="20" y="255" width="160" height="80" rx="16"/>
  <text class="head" x="100" y="290" text-anchor="middle">User</text>
  <text class="sub" x="100" y="311" text-anchor="middle">authenticated identity</text>

  <rect class="zone" x="580" y="180" width="160" height="80" rx="4"/>
  <text class="head" x="660" y="209" text-anchor="middle">Read-only tools</text>
  <text class="sub" x="660" y="228" text-anchor="middle">getShipmentStatus</text>
  <text class="sub" x="660" y="246" text-anchor="middle">results untrusted</text>

  <rect class="zone" x="580" y="300" width="160" height="80" rx="4"/>
  <text class="head" x="660" y="329" text-anchor="middle">Write tools</text>
  <text class="sub" x="660" y="348" text-anchor="middle">change external state</text>
  <text class="sub" x="660" y="366" text-anchor="middle">results untrusted</text>

  <rect class="zone" x="20" y="455" width="190" height="70" rx="16"/>
  <text class="head" x="115" y="484" text-anchor="middle">Human approval</text>
  <text class="sub" x="115" y="505" text-anchor="middle">high-impact actions</text>

  <rect class="zone" x="250" y="490" width="260" height="78" rx="4"/>
  <text class="head" x="380" y="519" text-anchor="middle">Memory · databases · logs · secrets</text>
  <text class="sub" x="380" y="540" text-anchor="middle">least access · retention limits</text>

  <!-- Application trust boundary -->
  <rect x="240" y="160" width="280" height="270" rx="4" fill="#191d18" stroke="#c7f36b" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="240" y="160" width="232" height="20" fill="#171a16" stroke="#c7f36b"/>
  <text class="tag" x="249" y="174">trust boundary: your application</text>
  <g>
    <rect x="262" y="194" width="236" height="34" rx="3" fill="#232822" stroke="#737b70"/>
    <text class="item" x="380" y="216" text-anchor="middle">Identity &amp; permission checks</text>
    <rect x="262" y="236" width="236" height="34" rx="3" fill="#232822" stroke="#737b70"/>
    <text class="item" x="380" y="258" text-anchor="middle">Schema validation &amp; limits</text>
    <rect x="262" y="278" width="236" height="34" rx="3" fill="#232822" stroke="#737b70"/>
    <text class="item" x="380" y="300" text-anchor="middle">Tool gateway</text>
    <rect x="262" y="320" width="236" height="34" rx="3" fill="#232822" stroke="#737b70"/>
    <text class="item" x="380" y="342" text-anchor="middle">Approval logic</text>
    <rect x="262" y="362" width="236" height="34" rx="3" fill="#232822" stroke="#737b70"/>
    <text class="item" x="380" y="384" text-anchor="middle">Logging (redacted)</text>
  </g>

  <!-- Flows -->
  <!-- User -> application -->
  <line x1="180" y1="295" x2="236" y2="295" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="208" y="285" text-anchor="middle">request</text>

  <!-- Application <-> model provider -->
  <line x1="330" y1="160" x2="330" y2="94" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="322" y="132" text-anchor="end">context</text>
  <line x1="430" y1="90" x2="430" y2="156" stroke="#9ce6db" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text class="lbl-untrusted" x="438" y="112">proposed actions</text>
  <text class="lbl-untrusted" x="438" y="128">untrusted</text>

  <!-- Retrieved content -> application -->
  <line x1="620" y1="90" x2="510" y2="157" stroke="#9ce6db" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text class="lbl-untrusted" x="578" y="146">untrusted content</text>

  <!-- Application -> tools -->
  <line x1="520" y1="220" x2="576" y2="220" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="548" y="210" text-anchor="middle">scoped</text>
  <line x1="576" y1="244" x2="524" y2="244" stroke="#9ce6db" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>

  <line x1="520" y1="340" x2="576" y2="340" stroke="#f0f0e8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="548" y="330" text-anchor="middle">approved</text>
  <line x1="576" y1="364" x2="524" y2="364" stroke="#9ce6db" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>

  <!-- Application <-> human approval -->
  <line x1="262" y1="430" x2="180" y2="455" stroke="#f0f0e8" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="196" y="430" text-anchor="end">approve / reject</text>

  <!-- Application <-> storage -->
  <line x1="380" y1="430" x2="380" y2="486" stroke="#f0f0e8" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="390" y="463">minimized · redacted</text>

  <!-- Legend -->
  <g>
    <rect x="20" y="590" width="26" height="14" fill="none" stroke="#a4a99f" stroke-dasharray="6 4"/>
    <text class="sub" x="54" y="602" style="fill:#d4d8cf">Dashed box: a separate trust boundary.</text>
    <line x1="330" y1="597" x2="360" y2="597" stroke="#9ce6db" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text class="sub" x="368" y="602" style="fill:#d4d8cf">Dashed arrow: untrusted data, never instructions.</text>
  </g>
</svg>
